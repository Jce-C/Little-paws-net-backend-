{% load static %}<link rel="icon" type="image/png" sizes="32x32" href="{% static 'seguridad/favicon-32.png' %}"><link rel="icon" type="image/svg+xml" sizes="any" href="{% static 'seguridad/favicon.svg' %}"><link rel="apple-touch-icon" sizes="180x180" href="{% static 'seguridad/apple-touch-icon.png' %}"><link rel="stylesheet" href="{% static 'seguridad/preferencias.css' %}"><link rel="stylesheet" href="{% static 'seguridad/tema.css' %}"><script src="{% url 'javascript-catalog' %}?language={{ LANGUAGE_CODE }}"></script><script src="{% static 'seguridad/preferencias.js' %}" defer></script>
