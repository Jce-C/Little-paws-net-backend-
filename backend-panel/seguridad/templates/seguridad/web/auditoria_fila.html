{% load i18n panel_i18n %}<tr><td><strong>{{ evento.actor_snapshot }}</strong><small>{{ evento.obj.fecha|date:'d/m/Y H:i:s' }}</small></td><td><strong class="audit-action-title">{{ evento.descripcion|ui }}</strong><small>{{ evento.categoria|ui }}</small></td><td>{{ evento.recurso_nombre|ui }}<small>{{ evento.elemento_nombre|default:'Registro'|ui }} · #{{ evento.obj.objeto_id|default:'—' }}</small></td><td><span class="audit-result" data-result="{{ evento.resultado }}">{{ evento.resultado_texto }}</span></td><td><button type="button" class="table-action" data-audit-detail="#audit-{{ evento.obj.pk }}">{% translate 'Ver detalle' %}</button><template id="audit-{{ evento.obj.pk }}"><h3>{{ evento.descripcion|ui }}</h3><dl class="business-detail"><dt>{% translate 'Actor' %}</dt><dd>{{ evento.actor_snapshot }} · #{{ evento.obj.actor_id|default:'—' }}</dd><dt>{% translate 'Roles vigentes al registrar' %}</dt><dd>{{ evento.roles_snapshot|ui_lista|join:', '|default:'No registrado'|ui }}</dd><dt>{% translate 'Resultado' %}</dt><dd>{{ evento.resultado_texto }}</dd><dt>{% translate 'Permiso registrado' %}</dt><dd>{{ evento.permiso_operacion|default:'No registrado' }}</dd><dt>{% translate 'Elemento' %}</dt><dd>{{ evento.elemento_nombre }} · #{{ evento.obj.objeto_id|default:'—' }}</dd><dt>{% translate 'Referencia de solicitud' %}</dt><dd>{{ evento.referencia_solicitud|default:'No registrado' }}</dd></dl><p><strong>{{ evento.actor_snapshot }}</strong> · {{ evento.obj.fecha|date:'d/m/Y H:i:s' }}</p><p>{{ evento.recurso_nombre|ui }} {% translate "· Registro #" %}{{ evento.obj.objeto_id|default:'—' }}</p>{% if evento.obj.motivo %}<p><strong>{% translate "Motivo:" %}</strong> {{ evento.obj.motivo }}</p>{% endif %}{% if evento.informacion_adicional %}<p>{{ evento.informacion_adicional }}</p>{% endif %}<div class="audit-change"><section><h3>{% translate "Antes" %}</h3><p class="audit-value">{{ evento.anterior|ui }}</p></section><section><h3>{% translate "Después" %}</h3><p class="audit-value">{{ evento.nuevo|ui }}</p></section></div><small>{% translate "Evento #" %}{{ evento.obj.pk }} · {{ evento.obj.accion }}</small></template></td></tr>
