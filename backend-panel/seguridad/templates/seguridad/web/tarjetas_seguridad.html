{% load i18n %}<nav class="security-navigation" data-nav-aria="nav_accesos" aria-label="{{ titulos_nav.nav_accesos }}"><div class="security-card-track" tabindex="0" role="region" aria-label="{% translate 'Secciones de seguridad' %}">{% for tarjeta in tarjetas_seguridad %}<a data-internal class="security-card {% if tab == tarjeta.tab or tab == 'excepciones' and tarjeta.tab == 'usuarios' %}selected{% endif %}" href="{{ tarjeta.url }}" {% if tab == tarjeta.tab or tab == 'excepciones' and tarjeta.tab == 'usuarios' %}aria-current="page"{% endif %}><span class="nav-icono" aria-hidden="true">{% include 'seguridad/web/icono.html' with nombre=tarjeta.icono %}</span><span data-nav-card="{{ tarjeta.codigo }}">{{ tarjeta.nombre }}</span></a>{% endfor %}</div></nav>
