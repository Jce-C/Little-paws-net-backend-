{% load i18n %}<aside class="preferencias" aria-label="{% translate 'Idioma y accesibilidad' %}">
<details class="preferencias-detalles"><summary>{% translate 'Idioma y accesibilidad' %}</summary><div class="preferencias-contenido">
<h2>{% translate 'Tu forma de ver el panel' %}</h2>
<form action="{% url 'set_language' %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><label for="idioma-vista">{% translate 'Idioma' %}</label><div class="preferencias-fila"><select id="idioma-vista" name="language"><option value="es" {% if LANGUAGE_CODE|slice:':2' == 'es' %}selected{% endif %}>Español</option><option value="en" {% if LANGUAGE_CODE|slice:':2' == 'en' %}selected{% endif %}>English</option></select><button type="submit">{% translate 'Cambiar idioma' %}</button></div></form>
<form action="{% url 'panel:preferencias' %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
<label for="tema-vista">{% translate 'Tema' %}</label><select id="tema-vista" name="tema"><option value="system" {% if vista.tema == 'system' %}selected{% endif %}>{% translate 'Según el dispositivo' %}</option><option value="light" {% if vista.tema == 'light' %}selected{% endif %}>{% translate 'Claro' %}</option><option value="dark" {% if vista.tema == 'dark' %}selected{% endif %}>{% translate 'Oscuro' %}</option></select>
<label for="texto-vista">{% translate 'Tamaño del texto' %}</label><select id="texto-vista" name="texto"><option value="normal" {% if vista.texto == 'normal' %}selected{% endif %}>{% translate 'Normal' %}</option><option value="large" {% if vista.texto == 'large' %}selected{% endif %}>{% translate 'Grande' %}</option><option value="largest" {% if vista.texto == 'largest' %}selected{% endif %}>{% translate 'Más grande' %}</option></select>
<label for="contraste-vista">{% translate 'Contraste' %}</label><select id="contraste-vista" name="contraste"><option value="normal" {% if vista.contraste == 'normal' %}selected{% endif %}>{% translate 'Original' %}</option><option value="strong" {% if vista.contraste == 'strong' %}selected{% endif %}>{% translate 'Reforzado' %}</option></select>
<label for="movimiento-vista">{% translate 'Animaciones' %}</label><select id="movimiento-vista" name="movimiento"><option value="system" {% if vista.movimiento == 'system' %}selected{% endif %}>{% translate 'Seguir mi dispositivo' %}</option><option value="reduce" {% if vista.movimiento == 'reduce' %}selected{% endif %}>{% translate 'Reducir movimiento' %}</option></select>
<p>{% translate 'Se guarda en este navegador. El zoom del navegador sigue disponible.' %}</p><div class="preferencias-acciones"><button type="submit">{% translate 'Guardar preferencias' %}</button><button type="submit" name="restablecer" value="1">{% translate 'Restablecer vista' %}</button></div></form>
</div></details></aside>
